[package]
name = "gnirehtet-ng"
version = "0.1.0"
authors = ["Romain Vimont <rom@rom1v.com>"]
edition = "2018"
license = "Apache-2.0"
build = "build.rs"

[lib]
name = "relaylib"
path = "src/lib.rs"

[[bin]]
name = "gnirehtet-ng"
path = "src/main.rs"

[[bin]]
name = "gnirehtet-core"
path = "src/bin/core.rs"

[[bin]]
name = "gnirehtet-cli"
path = "src/bin/cli.rs"

[dependencies]
mio = "0.6"       # for async I/O
slab = "0.4"      # helper for mio Tokens
log = "0.4"       # for logs
chrono = "0.4"    # for formatting timestamp in logs
byteorder = "1.3" # for reading/writing binary
rand = "0.7"      # for random TCP sequence number
ctrlc = { version = "3.0", features = ["termination"] }     # for handling Ctrl+C
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
lto = true     # link-time optimization
